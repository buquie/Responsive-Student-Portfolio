<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180">
  <title>Home network security checklist</title>
  <rect width="300" height="180" fill="#5b3cc4"/>
  <rect x="60" y="20" width="180" height="140" rx="10" fill="#ffffff"/>
  <text x="150" y="45" font-family="Arial" font-size="14" font-weight="bold" fill="#3f2a8c" text-anchor="middle">Wi-Fi Security Checklist</text>
  <g font-family="Arial" font-size="13" fill="#222222">
    <path d="M78 62 l6 6 l12 -13" stroke="#1a7f37" stroke-width="3" fill="none"/>
    <text x="104" y="68">Change router password</text>
    <path d="M78 88 l6 6 l12 -13" stroke="#1a7f37" stroke-width="3" fill="none"/>
    <text x="104" y="94">Use WPA2 / WPA3</text>
    <path d="M78 114 l6 6 l12 -13" stroke="#1a7f37" stroke-width="3" fill="none"/>
    <text x="104" y="120">Update firmware</text>
    <path d="M78 140 l6 6 l12 -13" stroke="#1a7f37" stroke-width="3" fill="none"/>
    <text x="104" y="146">Turn off WPS</text>
  </g>
</svg>
