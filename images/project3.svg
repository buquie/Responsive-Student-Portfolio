<svg xmlns="http://www.w3.org/2000/svg" width="300" height="180" viewBox="0 0 300 180">
  <title>Phishing email awareness guide</title>
  <rect width="300" height="180" fill="#7a5ce0"/>
  <rect x="40" y="25" width="220" height="130" rx="8" fill="#ffffff"/>
  <g font-family="Arial" font-size="12" fill="#222222">
    <text x="55" y="48">From: support@bank-secure.xyz</text>
    <text x="55" y="68" font-weight="bold">URGENT: Verify your account now!</text>
    <text x="55" y="90">Click here: http://secure-login.example</text>
    <text x="55" y="112">Attachment: invoice.exe</text>
  </g>
  <g fill="none" stroke="#c00000" stroke-width="2">
    <rect x="50" y="35" width="195" height="18" rx="3"/>
    <rect x="50" y="55" width="195" height="18" rx="3"/>
    <rect x="50" y="77" width="195" height="18" rx="3"/>
    <rect x="50" y="99" width="195" height="18" rx="3"/>
  </g>
  <text x="150" y="143" font-family="Arial" font-size="13" font-weight="bold" fill="#c00000" text-anchor="middle">4 warning signs</text>
</svg>
